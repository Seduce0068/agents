name: secret-scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        run: |
          set -euo pipefail
          VERSION=1.10.1
          BASE="https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}"
          curl -fsSL -o checksums.txt "${BASE}/checksums.txt"
          curl -fsSL -o betterleaks.tar.gz "${BASE}/betterleaks_${VERSION}_linux_x64.tar.gz"
          grep ' betterleaks_'"${VERSION}"'_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          install -m 0755 betterleaks /usr/local/bin/betterleaks
      - name: Scan full history
        run: betterleaks git --no-banner --redact --config .betterleaks.toml .
